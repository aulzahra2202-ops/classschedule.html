<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jadwal Kuliah</title>
    <style>
        /* Kotak luar pembungkus seluruh jadwal */
        .tabel-luar {
            border: 2px solid #000000;
            padding: 30px;
            width: fit-content;
            font-family: "Times New Roman", Times, serif;
            box-sizing: border-box;
            margin: 20px auto;
        }

        /* Judul utama "Jadwal Kuliah" tanpa tanda panah */
        .judul-utama {
            font-size: 38px;
            font-weight: bold;
            margin: 0 0 10px 0;
            text-align: left;
        }

        /* Sub-judul "Jadwal Kuliah Semester 1" */
        .sub-judul {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin: 0 auto 20px auto;
            width: 100%;
        }

        /* Pengaturan tabel jadwal */
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #000000;
            padding: 10px 15px;
            text-align: center; /* Membuat semua teks di dalam tabel rata tengah */
            font-size: 16px;
        }

        /* Menebalkan teks pada header dan kolom Hari */
        th, td:first-child {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="tabel-luar">
        <div class="judul-utama">Jadwal Kuliah</div>
        <div class="sub-judul">Jadwal Kuliah Semester 1</div>

        <table>
            <tr>
                <th>Hari</th>
                <th>Jam</th>
                <th>Mata Kuliah</th>
                <th>Ruangan</th>
            </tr>
            <tr>
                <td>Senin</td>
                <td>10:00 - 11:40</td>
                <td>Algoritma dan Pemrograman</td>
                <td>SI-1A</td>
            </tr>
            <tr>
                <td>Selasa</td>
                <td>10:00 - 12:30</td>
                <td>Orkorm & Arkom</td>
                <td>SI-1A</td>
            </tr>
            <tr>
                <td>Kamis</td>
                <td>14:20 - 16:00</td>
                <td>Kalkulus 1</td>
                <td>SI-1A</td>
            </tr>
            <tr>
                <td>Jumat</td>
                <td>08:00 - 09:40</td>
                <td>Manajemen Dan Organisasi</td>
                <td>SI-1A</td>
            </tr>
            <tr>
                <td colspan="3">Kegiatan Mahasiswa</td>
                <td>Kelas</td>
            </tr>
        </table>
    </div>

</body>
</html>
